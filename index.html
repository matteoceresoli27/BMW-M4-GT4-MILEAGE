<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M4 GT4 Mileage</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style id="css">
/* VOICE work: a team's pit-wall tool, calm and exact
   IDEA the component life sheet a race engineer keeps on a clipboard in the garage
   PICTURE large life meters of the parts closest to their limit, beside the odometer
   COLOUR carbon header band, white ground, signal blue for actions, red / amber / green for state
   TYPE Barlow Condensed for figures and titles + Barlow for text
   LAYOUT header band with odometer; meters left + tallies right; tabs below. Phone: stacked */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1114);--ink:light-dark(#121418,#eceef1);--mut:light-dark(#5d636c,#9aa1ab);--line:light-dark(#e3e5e8,#262a30);--panel:light-dark(#f5f6f7,#171a1e);--track:light-dark(#e9ebee,#252930);--blue:light-dark(#0b57d0,#5b9bff);--red:light-dark(#d4231a,#ff5a4f);--amb:light-dark(#c98a00,#ffbe2e);--grn:light-dark(#178a4c,#3fcf82);--carbon:#000000}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
.hd{background:var(--carbon);color:#f3f4f6;padding:18px 0 22px;position:sticky;top:0;z-index:10;transition:padding .2s}
.hd.mini{padding:8px 0 10px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.hd.mini .logos{padding-bottom:8px;margin-bottom:8px}
.hd.mini .logos .fs{max-height:30px}.hd.mini .logos .bm{max-height:28px}
.hd.mini h1{font-size:24px;margin:0}
.hd.mini .odo b{font-size:34px}
.hd.mini .carsel select{min-height:34px;padding:4px 8px}
.hd.mini .hdrow{align-items:center;gap:8px 20px}
.hd.mini .acts{margin-top:8px}
.hd.mini .acts .btn{min-height:36px;padding:0 12px;font-size:14px}
.hd.mini .sub,.hd.mini .odo span{font-size:13px}
html{scroll-padding-top:150px}
.logos{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid #2a2f36}
.logos img{display:block;height:auto;width:auto}
.logos .fs{max-height:56px;max-width:42%}
.logos .bm{max-height:52px;max-width:50%}
@media(max-width:600px){.logos .fs{max-height:40px}.logos .bm{max-height:36px}}
.hdrow{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between}
.car{display:flex;flex-direction:column;gap:6px}
.carsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.carsel select{background:#1d2127;border:1px solid #333a43;border-radius:8px;padding:8px 10px;min-height:40px;color:#f3f4f6;font-weight:600}
h1{font:700 clamp(32px,4.4vw,48px)/1.05 "Barlow Condensed",sans-serif;letter-spacing:-.01em;margin:4px 0 0}
.sub{color:#a9b0ba;font-size:15px}
.odo{text-align:right}
.odo b{display:block;font:700 clamp(44px,7vw,76px)/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.odo span{color:#a9b0ba;font-size:15px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 16px;min-height:44px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.row:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.hd .btn{background:#1d2127;border-color:#333a43;color:#f3f4f6}
.hd .btn.pri{background:#2f7bff;border-color:#2f7bff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.dng{color:var(--red)}
.save{font-size:13px;color:#a9b0ba;margin-left:auto;align-self:center}
.top{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;padding:28px 0 8px}
h2{font:600 26px/1.1 "Barlow Condensed",sans-serif;margin:0 0 14px}
.meters{display:flex;flex-direction:column;gap:12px}
.m{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;cursor:pointer;padding:6px 0;border:0;background:none;text-align:left;width:100%}
.m .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .rt{font:600 17px "Barlow Condensed",sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:12px;background:var(--track);border-radius:6px;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.bar.th{height:7px}
.m small{grid-column:1/-1;color:var(--mut);font-size:13px}
.tally{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.t{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;cursor:pointer}
.t b{display:block;font:700 40px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.t span{font-size:14px;color:var(--mut)}
.t.r b{color:var(--red)}.t.a b{color:var(--amb)}.t.g b{color:var(--grn)}
.last{margin-top:18px}
.last li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.last ul{list-style:none;margin:0;padding:0}
.last em{font-style:normal;color:var(--mut);white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:22px;overflow-x:auto}
.tab{flex:none;border:0;background:none;padding:12px 16px;min-height:44px;font:600 18px "Barlow Condensed",sans-serif;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--blue)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 0}
.tools input[type=search]{flex:1 1 220px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 14px;min-height:44px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:0 14px;min-height:36px;cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grp{margin:10px 0 24px}
.grp h3{font:600 20px "Barlow Condensed",sans-serif;margin:0;padding:8px 0;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between}
.grp h3 span{color:var(--mut);font-size:15px;font-weight:500}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 150px;gap:6px 20px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--panel)}
.row.off{opacity:.45}
.pn{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.nm2{font-weight:600}
.s1{display:inline-block;font-size:11px;font-weight:600;border:1px solid var(--mut);color:var(--mut);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px}
.lf{display:flex;flex-direction:column;gap:4px}
.lf .k{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-variant-numeric:tabular-nums}
.lf .k span{color:var(--mut)}
.st{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.st::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor;flex:none}
.c3{color:var(--red)}.c2{color:var(--amb)}.c1{color:var(--amb)}.c0{color:var(--grn)}.cn{color:var(--mut)}
.b3{background:var(--red)}.b2,.b1{background:var(--amb)}.b0{background:var(--grn)}.bn{background:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-weight:600;color:var(--mut);font-size:13px;padding:8px 8px;border-bottom:2px solid var(--ink)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nw{white-space:nowrap}
.tag{font-size:12px;font-weight:600;border-radius:4px;padding:2px 6px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.empty{padding:40px 0;color:var(--mut);text-align:center}
.demo{background:light-dark(#fff4d6,#2b2410);border-bottom:1px solid light-dark(#f0d58a,#4d4120);font-size:15px}
.demo .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.ov{position:fixed;inset:0;background:rgba(10,12,15,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow-y:auto;z-index:20}
.dlg{background:var(--bg);color:var(--ink);border-radius:16px;width:min(620px,100%);padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dlg h2{margin-bottom:6px}
.dlg .lead{color:var(--mut);margin:0 0 14px;font-size:15px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label{font-size:14px;font-weight:600}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px;width:100%}
.fld .hint{font-size:13px;color:var(--mut)}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px}
.seg button{flex:1;border:0;background:none;min-height:40px;cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:16px}
.foot .l{margin-right:auto}
.pick{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:4px 10px;margin-bottom:12px}
.pick label{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.pick label:last-child{border:0}
.pick input{width:20px;height:20px;flex:none}
.pick .pn{margin-left:auto;white-space:nowrap}
.pre{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:10px;margin:12px 0}
.kv div{background:var(--panel);border-radius:10px;padding:10px 12px}
.kv b{display:block;font:700 24px "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.kv span{font-size:13px;color:var(--mut)}
.hist{list-style:none;padding:0;margin:8px 0 0;font-size:14px}
.hist li{padding:6px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--carbon);color:#fff;border-radius:12px;padding:10px 12px 10px 18px;display:flex;gap:14px;align-items:center;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:calc(100% - 24px)}
.toast button{background:none;border:1px solid #444b55;color:#fff;border-radius:8px;min-height:36px;padding:0 12px;cursor:pointer;font-weight:600}
.note{font-size:13px;color:var(--mut);padding:24px 0 40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:900px){.top{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){.row{grid-template-columns:minmax(0,1fr) auto}.row .lf{grid-column:1/-1;grid-row:2}.f2{grid-template-columns:minmax(0,1fr)}.odo{text-align:left}.save{margin-left:0;width:100%}}
@media(max-width:600px){.hd.mini .sub,.hd.mini .odo span,.hd.mini .save,.hd.mini .carsel{display:none}.hd.mini .car{flex-direction:row;align-items:baseline;gap:10px}.hd.mini h1{font-size:20px}.hd.mini .odo b{font-size:26px}.hd.mini .hdrow{flex-wrap:nowrap;justify-content:space-between}.hd.mini .acts{flex-wrap:nowrap;overflow-x:auto;gap:6px;scrollbar-width:none}.hd.mini .acts .btn{flex:none}.hd.mini .acts .btn{font-size:13px;padding:0 10px}table{font-size:13px}th,td{padding:6px 4px}.hide-s{display:none}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .5s ease}}
</style>
<script id="state" type="application/json">null</script>
</head>

/* ---------- utilità ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=iso(new Date());
const fd=s=>{if(!s)return '—';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y.slice(2)};
const addM=(s,m)=>{const [y,mo,d]=s.split('-').map(Number);const x=new Date(y,mo-1+m,d);return iso(x)};
const days=(a,b)=>Math.round((new Date(a+'T12:00')-new Date(b+'T12:00'))/864e5);
const uid=()=>Math.random().toString(36).slice(2,9);
const aft=(x,r)=>x.d>r.d||(x.d===r.d&&x.s>r.s);

/* ---------- stato ---------- */
let S;
function makeComps(start,d){
  const out=[],seen={};
  CAT.forEach((k,i)=>{
    if(k.slot){
      if(seen[k.slot])return;
      const vars=CAT.filter(x=>x.slot===k.slot).map(x=>({pn:x.pn,en:x.en,life:x.life,svc:x.svc,st:x.st,mo:x.mo,s1:x.s1,vl:x.vl}));
      seen[k.slot]=1;
      const v=vars[vars.length-1];
      out.push({id:k.slot,g:k.g,hg:k.hg,name:k.it,vars,pick:vars.length-1,...v,on:true,startKm:start,svcStart:0,inst:{d,s:0},svcAt:null,exp:null,sn:''});
    }else out.push({id:'c'+i,g:k.g,hg:k.hg,name:k.it,pn:k.pn,en:k.en,life:k.life,svc:k.svc,st:k.st,mo:k.mo,s1:k.s1,on:true,startKm:start,svcStart:0,inst:{d,s:0},svcAt:null,exp:null,sn:''});
  });
  return out;
}
function newCar(name,chassis,initKm,same,d){
  return {id:uid(),name,chassis,initKm:+initKm||0,created:d,comps:makeComps(same?(+initKm||0):0,d),events:[],log:[]};
}

  [['2026-03-14','Vallelunga – test','Test',420],['2026-04-12','Monza – prove e gare','Gara',610],['2026-05-17','Imola – weekend','Gara',680],['2026-06-21','Misano – weekend','Gara',590],['2026-07-19','Mugello – weekend','Gara',720],['2026-09-13','Paul Ricard – weekend','Gara',840],['2026-10-18','Barcellona – weekend','Gara',760],['2026-11-08','Varano – test','Test',300]].forEach(e=>{c.events.push({id:uid(),d:e[0],s:s++,title:e[1],type:e[2],km:e[3],note:''})});
  const r={d:'2026-06-28',s:s++};
  ['c3','c4','c5','c6'].forEach(id=>{const x=c.comps.find(k=>k.id===id);c.log.push({id:uid(),t:'rep',d:r.d,s:r.s,cid:id,name:x.name,pn:x.pn,km:kmAt(c,x,r),note:'Tagliando di metà stagione',prev:snap(x)});x.inst=r;x.startKm=0;x.svcStart=0;x.svcAt=null});
  const r2={d:'2026-07-25',s:s++};c.comps.forEach(x=>{if(x.svc&&x.svc<=5000){c.log.push({id:uid(),t:'svc',d:r2.d,s:r2.s,cid:x.id,name:x.name,pn:x.pn,km:kmAt(c,x,r2),note:'Controllo 5.000 km',prev:snap(x)});x.svcAt={...r2}}});
  c.comps.forEach(x=>{if(x.pn==='8447757')x.exp='2030-12-31';if(x.pn==='8417339')x.exp='2029-12-31';if(x.pn==='7744033')x.exp='2026-12-31';if(x.pn==='8417489')x.exp='2028-12-31'});

function kmAt(car,x,ref){let k=x.startKm;for(const e of car.events)if(aft(e,x.inst)&&!aft(e,ref))k+=e.km;return k}
function sumAft(car,ref){let k=0;for(const e of car.events)if(aft(e,ref))k+=e.km;return k}
function snap(x){return JSON.parse(JSON.stringify({inst:x.inst,startKm:x.startKm,svcStart:x.svcStart,svcAt:x.svcAt,exp:x.exp,sn:x.sn,pick:x.pick}))}
function load(){
  let emb=null,ls=null;
  try{emb=JSON.parse(document.getElementById('state').textContent)}catch(e){}
  try{ls=JSON.parse(localStorage.getItem('m4gt4-mileage'))}catch(e){}
  if(ls&&(!emb||ls.rev>emb.rev)){pending=true;return ls}
  return emb||demo();
}
let pending=false;
S=load();
const car=()=>S.cars.find(c=>c.id===S.cur)||S.cars[0];
const total=c=>c.initKm+c.events.reduce((a,e)=>a+e.km,0);

/* ---------- calcolo stato componente ---------- */
function stat(c,x){
  const km=x.startKm+sumAft(c,x.inst);
  const sref=x.svcAt&&aft(x.svcAt,x.inst)?x.svcAt:null;
  const skm=sref?sumAft(c,sref):(x.svcStart||0)+sumAft(c,x.inst);
  const lp=x.life?km/x.life:null, sp=x.svc?skm/x.svc:null;
  let due=null;
  if(x.st==='E'||x.exp)due=x.exp||null;
  if(!due&&x.mo){const base=sref&&sref.d>x.inst.d?sref.d:x.inst.d;due=addM(base,x.mo)}
  const dl=due?days(due,TODAY):null;
  const W=S.warn/100,WD=S.warnDays;
  let lv=0,lab='In regola',why='';
  if(x.st==='E'&&!x.exp){lv=-1;lab='Scadenza da impostare'}
  if(lp!==null&&lp>=1){lv=3;lab='Da sostituire'}
  else if(dl!==null&&dl<0){lv=3;lab=x.st==='E'||x.st==='T'?'Scaduto':'Controllo scaduto'}
  else if(sp!==null&&sp>=1){lv=2;lab='Controllo dovuto'}
  else if((lp!==null&&lp>=W)||(dl!==null&&dl<=WD)){lv=1;lab='In scadenza'}
  else if(sp!==null&&sp>=W){lv=1;lab='Controllo vicino'}
  const tp=dl!==null?Math.max(0,1-dl/365):0;
  const score=Math.max(lp||0,(sp||0)*.97,tp)+(lv===3?2:lv===2?1:0);
  return {km,skm,lp,sp,due,dl,lv,lab,score,tp};
}
const cls=lv=>lv<0?'n':String(lv);
function meterTxt(x,s){
  if(s.lv===3&&s.lp>=1)return ['Superato di '+nf(s.km-x.life)+' km',1,s.lp];
  if(s.dl!==null&&(s.dl<0||(!x.life&&!x.svc)||s.tp>Math.max(s.lp||0,s.sp||0)))return [s.dl<0?'Scaduto da '+(-s.dl)+' gg':'Scade tra '+s.dl+' gg',0,Math.min(1,Math.max(0,1-s.dl/365))];
  const lr=x.life?x.life-s.km:Infinity,sr=x.svc?x.svc-s.skm:Infinity;
  if(s.lv===2)return ['Controllo superato di '+nf(-sr)+' km',0,1];
  if(sr<lr&&(s.sp||0)>(s.lp||0))return ['Controllo tra '+nf(sr)+' km',0,s.sp];
  if(x.life)return ['Mancano '+nf(lr)+' km',1,s.lp];
  if(s.dl!==null)return ['Scade tra '+s.dl+' gg',0,1-s.dl/365];
  return ['—',0,0];
}

  ${x.st?`<p class="pn">${esc(ST[x.st])}${x.mo?` · ogni ${x.mo} mesi`:''}</p>`:''}
  <div class="foot" style="justify-content:flex-start"><button class="btn pri" data-x="one-rep" data-id="${id}">Sostituisci</button>${x.svc||x.mo?`<button class="btn" data-x="one-svc" data-id="${id}">Controllo eseguito</button>`:''}<button class="btn" data-x="edit" data-id="${id}">Modifica</button></div>
  <h2 style="margin-top:18px;font-size:20px">Storico</h2>${h.length?`<ul class="hist">${h.map(l=>`<li>${fd(l.d)} · ${l.t==='rep'?'Sostituito':'Controllato'} a ${nf(l.km)} km${l.sn?' · S/N '+esc(l.sn):''}${l.note?' · '+esc(l.note):''}</li>`).join('')}</ul>`:'<p class="pn">Montato dal '+fd(x.inst.d)+'. Nessun intervento registrato.</p>'}
  <div class="foot"><button class="btn" data-x="close">Chiudi</button></div>`);
}
function dEdit(id){
  const c=car(),x=id?c.comps.find(k=>k.id===id):null,s=x?stat(c,x):null;
  dlg(`<h2>${x?'Modifica componente':'Nuovo componente'}</h2><p class="lead">${x?'Correggi i limiti o i km attuali, ad esempio per un pezzo già usato.':'Aggiungi un componente non presente nell\'elenco del manuale.'}</p>
  ${x&&x.vars?`<div class="fld"><label for="cv">Versione montata</label><select id="cv">${x.vars.map((w,i)=>`<option value="${i}"${i===x.pick?' selected':''}>${esc(w.pn)} – ${esc(w.vl)}${w.life?' – vita '+nf(w.life)+' km':''}</option>`).join('')}</select></div>`:''}
  <div class="fld"><label for="cn">Nome</label><input id="cn" value="${esc(x?x.name:'')}"></div>
  <div class="f2"><div class="fld"><label for="cp">Codice</label><input id="cp" value="${esc(x?x.pn:'')}"></div><div class="fld"><label for="cs">S/N</label><input id="cs" value="${esc(x?x.sn:'')}"></div>
  <div class="fld"><label for="cl">Vita max (km)</label><input id="cl" type="number" min="0" value="${x&&x.life||''}"><span class="hint">Vuoto = nessun limite</span></div><div class="fld"><label for="ci">Controllo ogni (km)</label><input id="ci" type="number" min="0" value="${x&&x.svc||''}"></div>
  <div class="fld"><label for="cm">Intervallo a tempo (mesi)</label><input id="cm" type="number" min="0" value="${x&&x.mo||''}"></div><div class="fld"><label for="cx">Data scadenza fissa</label><input id="cx" type="date" value="${x&&x.exp||''}"></div>
  <div class="fld"><label for="ck">Km attuali del pezzo</label><input id="ck" type="number" min="0" value="${s?Math.round(s.km):0}"></div><div class="fld"><label for="cc">Km dall'ultimo controllo</label><input id="cc" type="number" min="0" value="${s?Math.round(s.skm):0}"></div>
  ${x?'':`<div class="fld"><label for="cg">Gruppo</label><select id="cg">${Object.entries(GR).map(([k,l])=>`<option value="${k}"${k==='cus'?' selected':''}>${l}</option>`).join('')}</select></div>`}
  </div>
  ${x?`<label style="display:flex;gap:10px;align-items:center;min-height:44px"><input id="con" type="checkbox"${x.on?' checked':''} style="width:20px;height:20px"> Montato su questo telaio</label>`:''}
  <div class="foot">${x&&x.custom?'<button class="btn dng l" data-x="cdel" data-id="'+x.id+'">Elimina</button>':''}<button class="btn" data-x="close">Annulla</button><button class="btn pri" data-x="csave" data-id="${x?x.id:''}">Salva</button></div>`);
  const cv=$('#cv');if(cv)cv.onchange=()=>{const w=x.vars[+cv.value];$('#cp').value=w.pn;$('#cl').value=w.life||'';$('#ci').value=w.svc||''};
}
function saveComp(id){
  const c=car();const name=v('cn');if(!name){$('#cn').focus();return}
  const vals={name,pn:v('cp')||'—',sn:v('cs'),life:+v('cl')||0,svc:+v('ci')||0,mo:+v('cm')||0,exp:v('cx')||null};
  const km=+v('ck')||0,skm=+v('cc')||0,cv=$('#cv'),con=$('#con');
  close();
  mutate(()=>{let x=id?c.comps.find(k=>k.id===id):null;
    if(!x){x={id:'u'+uid(),g:v('cg')||'cus',hg:'',en:'Aggiunto dall\'utente',st:'',s1:false,on:true,custom:true,inst:{d:TODAY,s:S.seq++},svcAt:null,startKm:0,svcStart:0};c.comps.push(x)}
    if(cv&&x.vars){x.pick=+cv.value;const w=x.vars[x.pick];Object.assign(x,{en:w.en,st:w.st,s1:w.s1,vl:w.vl})}
    Object.assign(x,vals);if(con)x.on=con.checked;
    if(!x.st&&x.svc)x.st='V';if(!x.st&&x.mo)x.st='S';
    const after=sumAft(c,x.inst);x.startKm=km-after;
    if(x.svcAt&&aft(x.svcAt,x.inst))x.svcAt=null;x.svcStart=skm-after;
  },'Componente salvato');
}
function dCar(edit){
  const c=edit?car():null;
  dlg(`<h2>${c?'Impostazioni telaio':'Nuovo telaio'}</h2><p class="lead">${c?'Dati del telaio, soglie di avviso e backup.':'Tutti i componenti del manuale vengono creati automaticamente.'}</p>
  <div class="f2"><div class="fld"><label for="tn">Nome</label><input id="tn" value="${esc(c?c.name:'M4 GT4 EVO #'+(S.cars.filter(k=>!k.demo).length+1))}"></div><div class="fld"><label for="tc">Numero telaio</label><input id="tc" value="${esc(c?c.chassis:'')}"></div>
  <div class="fld"><label for="tk">Km iniziali telaio</label><input id="tk" type="number" min="0" value="${c?c.initKm:0}"><span class="hint">Km già percorsi prima del primo evento registrato.</span></div>
  ${c?`<div class="fld"><label for="tw">Avviso “in scadenza” da (%)</label><input id="tw" type="number" min="50" max="99" value="${S.warn}"></div><div class="fld"><label for="twd">Avviso scadenze a tempo (giorni)</label><input id="twd" type="number" min="1" value="${S.warnDays}"></div>`:`<div class="fld"><label for="ts">Km dei componenti</label><select id="ts"><option value="0">Tutti nuovi (0 km)</option><option value="1">Uguali ai km del telaio</option></select><span class="hint">Potrai correggere ogni pezzo singolarmente.</span></div>`}
  </div>
  ${c?`<h2 style="font-size:20px;margin-top:8px">Backup</h2><p class="pn">Copia i dati per conservarli o per spostarli; incolla un backup per ripristinarlo.</p><div class="fld"><label for="tj">Dati (JSON)</label><textarea id="tj" rows="3" placeholder="Incolla qui un backup per importarlo"></textarea></div><div class="foot" style="justify-content:flex-start;margin-top:0"><button class="btn sm" data-x="copy">Copia backup</button><button class="btn sm" data-x="import">Importa backup</button></div>`:''}
  <div class="foot">${c&&S.cars.length>1?'<button class="btn dng l" data-x="cardel">Elimina telaio</button>':''}<button class="btn" data-x="close">Annulla</button><button class="btn pri" data-x="carsave" data-edit="${edit?1:''}">${c?'Salva':'Crea telaio'}</button></div>`);
}
function saveCar(edit){
  const name=v('tn')||'M4 GT4',ch=v('tc'),k=+v('tk')||0;
  if(edit){const c=car(),w=+v('tw'),wd=+v('twd');close();mutate(()=>{c.name=name;c.chassis=ch;c.initKm=k;if(w>=50&&w<100)S.warn=w;if(wd>0)S.warnDays=wd},'Impostazioni salvate')}
  else{const same=v('ts')==='1';close();mutate(()=>{const n=newCar(name,ch,k,same,TODAY);S.cars=S.cars.filter(x=>!x.demo);S.cars.push(n);S.cur=n.id},'Telaio creato')}
}
let tt=null;
function toast(m,u){clearTimeout(tt);let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.innerHTML=`<span>${esc(m)}</span>${u&&undo.length?'<button data-x="undo">Annulla</button>':''}`;tt=setTimeout(()=>el.remove(),6000)}

/* ---------- eventi ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-open]');if(!b)return;const d=b.dataset;
  if(d.a==='event')return dEvent();
  if(d.a==='rep')return dBatch('rep');
  if(d.a==='svc')return dBatch('svc');
  if(d.a==='settings')return dCar(true);
  if(d.a==='newcar')return dCar(false);
  if(d.a==='addcomp')return dEdit();
  if(d.tab){tab=d.tab;try{history.replaceState(null,'','#'+tab)}catch(_){}return render()}
  if(d.f!==undefined&&!b.closest('#ov')){filt=b.classList.contains('t')?d.f:(filt===d.f?'all':d.f);tab='comp';render();if(b.classList.contains('t'))$('#pane').scrollIntoView({behavior:'smooth'});return}
  if(d.open&&!b.closest('#ov'))return dComp(d.open);
  if(d.ev)return dEvent(d.ev);
  if(d.undo){const c=car(),l=c.log.find(o=>o.id===d.undo);return mutate(()=>{const x=c.comps.find(k=>k.id===l.cid);if(x&&l.prev)Object.assign(x,l.prev);c.log=c.log.filter(o=>o.id!==l.id)},'Intervento annullato')}
  switch(d.x){
    case 'close':return close();
    case 'evsave':return saveEvent(d.id);
    case 'evdel':{const c=car(),id=$('[data-x=evsave]').dataset.id;close();return mutate(()=>{c.events=c.events.filter(x=>x.id!==id)},'Evento eliminato')}
    case 'repsave':return saveBatch('rep');
    case 'svcsave':return saveBatch('svc');
    case 'one-rep':return dBatch('rep',[d.id]);
    case 'one-svc':return dBatch('svc',[d.id]);
    case 'edit':return dEdit(d.id);
    case 'csave':return saveComp(d.id);
    case 'cdel':{const c=car();close();return mutate(()=>{c.comps=c.comps.filter(x=>x.id!==d.id)},'Componente eliminato')}
    case 'carsave':return saveCar(!!d.edit);
    case 'cardel':{const id=S.cur;close();return mutate(()=>{S.cars=S.cars.filter(x=>x.id!==id);S.cur=S.cars[0].id},'Telaio eliminato')}
    case 'copy':{const t=JSON.stringify(S);$('#tj').value=t;$('#tj').select();try{navigator.clipboard.writeText(t).then(()=>toast('Backup copiato negli appunti'),()=>toast('Seleziona il testo e copialo'))}catch(_){toast('Seleziona il testo e copialo')}return}
    case 'import':{let o;try{o=JSON.parse(v('tj'))}catch(_){}if(!o||!Array.isArray(o.cars)||!o.cars.length){$('#tj').style.borderColor='var(--red)';return}close();return mutate(()=>{S=o},'Backup importato')}
    case 'undo':{if(!undo.length)return;S=JSON.parse(undo.pop());S.rev=Date.now();try{localStorage.setItem('m4gt4-mileage',JSON.stringify(S))}catch(_){}render();schedule();$('#toast')&&$('#toast').remove();return}
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#ov').innerHTML)close();
  if(e.key==='Enter'&&e.target.classList.contains('row'))dComp(e.target.dataset.open);
});
document.addEventListener('change',e=>{if(e.target.id==='carsel'){const val=e.target.value;if(val==='+'){e.target.value=S.cur;return dCar(false)}S.cur=val;try{localStorage.setItem('m4gt4-mileage',JSON.stringify(S))}catch(_){}render()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;const p=e.target.selectionStart;render();const i=$('#q');i.focus();i.setSelectionRange(p,p)}});
$('#ov').addEventListener('click',e=>{if(e.target.classList.contains('ov'))close()});

render();
addEventListener('scroll',()=>{const y=scrollY,n=mini?y>40:y>140;if(n!==mini){mini=n;const h=$('#hd');if(h)h.classList.toggle('mini',mini)}},{passive:true});
let tries=0;const hook=()=>{if(window.claude&&window.claude.use){window.claude.use('artifact').then(a=>{art=a;if(a){setSave('Salvato');if(pending)schedule()}}).catch(()=>{})}else if(++tries<20)setTimeout(hook,250)};hook();
}
</script>
</body>
</html>
